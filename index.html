function distance(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function fetchTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const minut = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
  } finally {
    clearTimeout(minut);
  }
}

function trapeze(x, p) {
  if (x <= p[0] || x >= p[3]) return 0;
  if (x < p[1]) return (x - p[0]) / (p[1] - p[0]);
  if (x <= p[2]) return 1;
  return (p[3] - x) / (p[3] - p[2]);
}

// Saison lissée entre le mois en cours et le mois voisin
function facteurSaison(mois, date) {
  const m = date.getMonth();
  const jours = new Date(date.getFullYear(), m + 1, 0).getDate();
  const pos = (date.getDate() - 0.5) / jours - 0.5;
  const voisin = pos >= 0 ? (m + 1) % 12 : (m + 11) % 12;
  return mois[m] * (1 - Math.abs(pos)) + mois[voisin] * Math.abs(pos);
}

function majSaisons() {

/* ---------- Météo et altitude ---------- */

function resumerJours(d) {
  const n = d.time.length;
  const ok = x => x != null;
  // Pluie de J-14 à J-2 : les champignons sortent quelques jours après la pluie
  const pluie = d.precipitation_sum.slice(0, Math.max(0, n - 2)).filter(ok).reduce((a, b) => a + b, 0);
  const tm = [];
  for (let i = Math.max(0, n - 10); i < n; i++) {
    if (ok(d.temperature_2m_max[i]) && ok(d.temperature_2m_min[i])) {
      tm.push((d.temperature_2m_max[i] + d.temperature_2m_min[i]) / 2);
    }
  }
  const mins = d.temperature_2m_min.slice(Math.max(0, n - 5)).filter(ok);
  return {
    pluie,
    tmoy: tm.length ? tm.reduce((a, b) => a + b, 0) / tm.length : null,
    tmin: mins.length ? Math.min(...mins) : null
  };
}

function indiceGenerique(v) {
  const fT = v.tmoy == null ? 0.5 : trapeze(v.tmoy, [4, 10, 20, 26]);
  const fG = v.tmin != null && v.tmin < -1 ? 0.4 : 1;
  return Math.min(1, v.pluie / 40) * fT * fG;
}

// Météo d'un point à une date (pour enregistrer une sortie)
async function meteoPoint(lat, lng, date) {
  const fmt = d => d.toISOString().slice(0, 10);
  const la = lat.toFixed(2), lo = lng.toFixed(2);
  const fin = new Date(date);
  const debut = new Date(fin.getTime() - 14 * 86400000);
  const cle = `${la},${lo},${fmt(fin)}`;
  const c = cacheMeteo[cle];
  if (c && Date.now() - c.t < 2 * 3600000) return c.v;
  const params = `?latitude=${la}&longitude=${lo}&start_date=${fmt(debut)}&end_date=${fmt(fin)}` +
                 '&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=auto';
  for (const base of ['https://api.open-meteo.com/v1/forecast', 'https://archive-api.open-meteo.com/v1/archive']) {
    try {
      const j = await (await fetchTimeout(base + params, {}, 15000)).json();
      if (!j.daily || !j.daily.time) continue;
      const v = resumerJours(j.daily);
      v.indice = indiceGenerique(v);
      cacheMeteo[cle] = { t: Date.now(), v };
      return v;
    } catch (e) {}
  }
  return null;
}

function grillePoints(zone, rows, cols) {
  const S = zone.getSouth(), N = zone.getNorth(), W = zone.getWest(), E = zone.getEast();
  const lats = [], lngs = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      lats.push(S + (N - S) * r / (rows - 1));
      lngs.push(W + (E - W) * c / (cols - 1));
    }
  }
  return { S, N, W, E, rows, cols, lats, lngs };
}

async function chargerMeteoGrille(zone) {
  const g = grillePoints(zone, GM_ROWS, GM_COLS);
  const fmt = d => d.toISOString().slice(0, 10);
  const fin = new Date();
  const debut = new Date(fin.getTime() - 14 * 86400000);
  const url = 'https://api.open-meteo.com/v1/forecast' +
              `?latitude=${g.lats.map(x => x.toFixed(4)).join(',')}&longitude=${g.lngs.map(x => x.toFixed(4)).join(',')}` +
              `&start_date=${fmt(debut)}&end_date=${fmt(fin)}` +
              '&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=auto';
  const j = await (await fetchTimeout(url, {}, 20000)).json();
  const liste = Array.isArray(j) ? j : [j];
  const pts = liste.map(o => {
    if (!o || !o.daily || !o.daily.time) return null;
    const v = resumerJours(o.daily);
    v.elev = typeof o.elevation === 'number' ? o.elevation : null;
    return v;
  });
  const ok = pts.filter(Boolean);
  if (!ok.length || pts.length !== g.rows * g.cols) throw new Error(j && j.reason ? j.reason : 'météo indisponible');
  const moy = champ => {
    const a = ok.map(p => p[champ]).filter(x => x != null);
    return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  };
  const m = { pluie: moy('pluie'), tmoy: moy('tmoy'), tmin: moy('tmin'), elev: moy('elev') };
  const val = (p, k, def) => (p && p[k] != null) ? p[k] : (m[k] != null ? m[k] : def);
  g.pluie = Float32Array.from(pts.map(p => val(p, 'pluie', 0)));
  g.tmoy = Float32Array.from(pts.map(p => val(p, 'tmoy', 12)));
  g.tmin = Float32Array.from(pts.map(p => val(p, 'tmin', 5)));
  g.elev = m.elev == null ? null : Float32Array.from(pts.map(p => val(p, 'elev', 0)));
  const aP = Array.from(g.pluie), aT = Array.from(g.tmoy);
  g.resume = {
    pMin: Math.round(Math.min(...aP)), pMax: Math.round(Math.max(...aP)),
    tMin: Math.min(...aT), tMax: Math.max(...aT)
  };
  return g;
}

async function chargerAltitudes(zone) {
  const g = grillePoints(zone, GE_ROWS, GE_COLS);
  const n = g.lats.length;
  const vals = new Float32Array(n);
  const requetes = [];
  for (let k = 0; k < n; k += 100) {
    const la = g.lats.slice(k, k + 100).map(x => x.toFixed(4)).join(',');
    const lo = g.lngs.slice(k, k + 100).map(x => x.toFixed(4)).join(',');
    requetes.push(
      fetchTimeout(`https://api.open-meteo.com/v1/elevation?latitude=${la}&longitude=${lo}`, {}, 15000)
        .then(r => r.json())
        .then(j => {
          if (!j.elevation) throw new Error('altitude');
          j.elevation.forEach((e, i) => { vals[k + i] = e; });
        })
    );
  }
  await Promise.all(requetes);
  g.vals = vals;
  return g;
}

function zoneEnv(vue) {
  const c = vue.getCenter();
  return vue.pad(0.3).extend(L.latLngBounds([c.lat - 0.03, c.lng - 0.045], [c.lat + 0.03, c.lng + 0.045]));
}

function assurerEnv(vue) {
  if (env && env.zone.contains(vue) && Date.now() - env.t < 2 * 3600000) return Promise.resolve();
  if (chargementEnv && chargementEnv.zone.contains(vue)) return chargementEnv.promise;
  const zone = zoneEnv(vue);
  const promise = Promise.all([chargerMeteoGrille(zone), chargerAltitudes(zone).catch(() => null)])
    .then(([meteo, alt]) => { env = { zone, meteo, alt, t: Date.now() }; envErreur = ''; })
    .catch(e => { envErreur = e.message || 'erreur'; })
    .finally(() => { if (chargementEnv && chargementEnv.promise === promise) chargementEnv = null; });
  chargementEnv = { zone, promise };
  return promise;
}

function bilin(g, lat, lng) {
  const fr = clamp((lat - g.S) / (g.N - g.S) * (g.rows - 1), 0, g.rows - 1);
  const fc = clamp((lng - g.W) / (g.E - g.W) * (g.cols - 1), 0, g.cols - 1);
  const r0 = Math.floor(fr), c0 = Math.floor(fc);
  const r1 = Math.min(r0 + 1, g.rows - 1), c1 = Math.min(c0 + 1, g.cols - 1);
  const a = fr - r0, b = fc - c0;
  return [r0 * g.cols + c0, r0 * g.cols + c1, r1 * g.cols + c0, r1 * g.cols + c1,
          (1 - a) * (1 - b), (1 - a) * b, a * (1 - b), a * b];
}

function interp(vals, w) {
  return vals[w[0]] * w[4] + vals[w[1]] * w[5] + vals[w[2]] * w[6] + vals[w[3]] * w[7];
}

// Conditions locales : météo interpolée, température corrigée par l'altitude
function envEn(lat, lng) {
  if (!env) return null;
  const g = env.meteo;
  const w = bilin(g, lat, lng);
  let t = interp(g.tmoy, w);
  let tmin = interp(g.tmin, w);
  const pluie = interp(g.pluie, w);
  let alt = null;
  if (env.alt) {
    alt = interp(env.alt.vals, bilin(env.alt, lat, lng));
    if (g.elev) {
      const dz = alt - interp(g.elev, w);
      t -= GRADIENT_T * dz;
      tmin -= GRADIENT_T * dz;
    }
  }
  return { t, tmin, pluie, alt };
}

/* ---------- Habitats (IGN BD Forêt, OpenStreetMap en secours) ---------- */

function classerTexte(txt) {
  if (/lande/.test(txt)) return 'lande';
  if (/herbac/.test(txt)) return 'ouvert';
  if (/peupl/.test(txt)) return 'peupleraie';
  if (/mixte/.test(txt) || (/feuillu/.test(txt) && /conif/.test(txt))) return 'mixte';
  if (/ch[eê]ne/.test(txt)) return 'chene';
  if (/h[eê]tre/.test(txt)) return 'hetre';
  if (/ch[aâ]taign/.test(txt)) return 'chataignier';
  if (/\bpins?\b/.test(txt)) return 'pin';
  if (/sapin|[eé]pic[eé]a|douglas|m[eé]l[eè]ze/.test(txt)) return 'sapin';
  if (/conif/.test(txt)) return 'coniferes';
  if (/feuillu|robinier|bouleau|fr[eê]ne|charme|aulne/.test(txt)) return 'feuillus';
  return 'foret';
}

function ajouterPoly(liste, rings, code) {
  rings = rings.filter(r => r.length > 1);
  if (!rings.length) return;
  const b = [90, 180, -90, -180];
  for (const r of rings) for (const p of r) {
    if (p[0] < b[0]) b[0] = p[0];
    if (p[1] < b[1]) b[1] = p[1];
    if (p[0] > b[2]) b[2] = p[0];
    if (p[1] > b[3]) b[3] = p[1];
  }
  liste.push({ rings, b, h: H[code] });
}

async function chargerIGN(zone) {
  const S = zone.getSouth(), N = zone.getNorth(), W = zone.getWest(), E = zone.getEast();
  const base = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature' +
               '&TYPENAMES=LANDCOVER.FORESTINVENTORY.V2:formation_vegetale' +
               '&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326' +
               `&BBOX=${S.toFixed(5)},${W.toFixed(5)},${N.toFixed(5)},${E.toFixed(5)},urn:ogc:def:crs:EPSG::4326`;
  const liste = [];
  let lonlat = null;
  for (let page = 0; page < 6; page++) {
    let feats;
    try {
      const r = await fetchTimeout(base + `&COUNT=1000&STARTINDEX=${page * 1000}`, {}, 25000);
      if (!r.ok) throw new Error('IGN ' + r.status);
      feats = (await r.json()).features || [];
    } catch (e) {
      if (page === 0) throw e;
      break;
    }
    for (const f of feats) {
      const g = f.geometry;
      if (!g || (g.type !== 'Polygon' && g.type !== 'MultiPolygon')) continue;
      const groupes = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      if (!groupes.length || !groupes[0].length || !groupes[0][0].length) continue;
      if (lonlat === null) {
        const c0 = groupes[0][0][0];
        lonlat = c0[0] >= W - 1 && c0[0] <= E + 1 && c0[1] >= S - 1 && c0[1] <= N + 1;
      }
      const rings = [];
      for (const p of groupes) for (const ring of p) rings.push(ring.map(c => lonlat ? [c[1], c[0]] : [c[0], c[1]]));
      const txt = Object.values(f.properties || {}).filter(x => typeof x === 'string').join(' ').toLowerCase();
      ajouterPoly(liste, rings, classerTexte(txt));
    }
    if (feats.length < 1000) break;
  }
  return liste;
}

async function overpass(q) {
  let derniere = 'serveur injoignable';
  for (const url of OVERPASS) {
    try {
      const r = await fetchTimeout(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q)
      }, 20000);
      if (r.ok) {
        const j = await r.json();
        if (j.remark && /error|timed out/i.test(j.remark)) { derniere = 'serveur saturé'; continue; }
        return j;
      }
      derniere = r.status === 429 ? 'trop de requêtes' : 'serveur saturé';
    } catch (e) {
      derniere = 'serveur injoignable';
    }
  }
  throw new Error(derniere);
}

async function chargerOSM(zone) {
  const bb = [zone.getSouth(), zone.getWest(), zone.getNorth(), zone.getEast()].map(x => x.toFixed(5)).join(',');
  const q = `[out:json][timeout:20];(way["landuse"="forest"](${bb});way["natural"="wood"](${bb});` +
            `relation["landuse"="forest"](${bb});relation["natural"="wood"](${bb}););out geom;`;
  const data = await overpass(q);
  const liste = [];
  for (const el of data.elements || []) {
    let rings = [];
    if (el.type === 'way' && el.geometry) {
      const g = el.geometry.filter(Boolean).map(p => [p.lat, p.lon]);
      if (g.length > 2 && (g[0][0] !== g[g.length - 1][0] || g[0][1] !== g[g.length - 1][1])) g.push(g[0]);
      rings = [g];
    } else if (el.type === 'relation' && el.members) {
      rings = el.members.filter(m => m.type === 'way' && m.geometry)
        .map(m => m.geometry.filter(Boolean).map(p => [p.lat, p.lon]));
    }
    const lt = el.tags && el.tags.leaf_type;
    const code = lt === 'broadleaved' ? 'feuillus' : lt === 'needleleaved' ? 'coniferes' : lt === 'mixed' ? 'mixte' : 'foret';
    ajouterPoly(liste, rings, code);
  }
  return liste;
}

async function chargerHabitat(zone) {
  try {
    const l = await chargerIGN(zone);
    if (l.length) return { liste: l, source: 'IGN BD Forêt' };
  } catch (e) {}
  return { liste: await chargerOSM(zone), source: 'OpenStreetMap' };
}

function zoneHab(vue) {
  const c = vue.getCenter();
  return vue.pad(0.15).extend(L.latLngBounds([c.lat - 0.025, c.lng - 0.035], [c.lat + 0.025, c.lng + 0.035]));
}

function assurerHab(vue) {
  if (habZone && habZone.contains(vue)) return Promise.resolve();
  if (chargementHab && chargementHab.zone.contains(vue)) return chargementHab.promise;
  const zone = zoneHab(vue);
  const promise = chargerHabitat(zone)
    .then(r => { polys = r.liste; habZone = zone; habSource = r.source; habErreur = ''; })
    .catch(e => { habErreur = e.message || 'erreur'; })
    .finally(() => { if (chargementHab && chargementHab.promise === promise) chargementHab = null; });
  chargementHab = { zone, promise };
  return promise;
}

function habitatEn(lat, lng) {
  if (!habZone || !habZone.contains([lat, lng])) return INCONNU;
  let code = H.ouvert;
  for (const poly of polys) {
    if (lat < poly.b[0] || lat > poly.b[2] || lng < poly.b[1] || lng > poly.b[3]) continue;
    let dedans = false;
    for (const ring of poly.rings) {
      for (let k = 0; k < ring.length - 1; k++) {
        const a = ring[k], b = ring[k + 1];
        if ((a[0] > lat) !== (b[0] > lat) &&
            lng < a[1] + (lat - a[0]) * (b[1] - a[1]) / (b[0] - a[0])) dedans = !dedans;
      }
    }
    if (dedans && (code === H.ouvert || code === H.foret)) code = poly.h;
  }
  return code;
}

/* ---------- Calcul par espèce ---------- */

// Météo et saison d'abord, habitat ensuite
function scoreEspece(e, hab, en) {
  const h = hab === INCONNU ? 0.5 : (e.hab[HABITATS[hab]] || 0);
  if (!h || !e.saisonAuj) return 0;
  const fT = trapeze(en.t, e.temp);
  if (!fT) return 0;
  const fP = Math.min(1, en.pluie / e.pluie);
  const fG = en.tmin < -2 ? e.gel : 1;
  return P_PLAFOND * e.saisonAuj * h * fT * fP * fG;
}

function poidsSortie(s, now) {
  const age = Math.max(0, (now - new Date(s.date).getTime()) / 86400000);
  let fiab = 1;
  if (!s.found) {
    // Une sortie sans résultat par temps défavorable compte peu
    if (s.indice != null) fiab = s.indice;
    else if (s.pluie != null) fiab = Math.min(1, s.pluie / 40);
    else fiab = 0.5;
    fiab = Math.max(0.1, fiab);
  }
  return Math.pow(0.5, age / DEMI_VIE) * fiab;
}

function ajustement(sw, swy) {
  if (sw <= 0) return 1;
  return 1 + AJUST_MAX * (2 * swy - sw) / (sw + 1);
}

function sortiesPour(id) {
  return id === 'toutes' ? sorties : sorties.filter(s => !s.espece || s.espece === id);
}

function especesEn(lat, lng) {
  majSaisons();
  const en = envEn(lat, lng) || DEFAUT_ENV;
  const hab = habitatEn(lat, lng);
  const now = Date.now();
  const proches = sorties.map(s => ({ s, d: distance(lat, lng, s.lat, s.lng) })).filter(x => x.d <= RAYON);
  const ajustPour = id => {
    let sw = 0, swy = 0;
    for (const { s, d } of proches) {
      if (id !== 'toutes' && s.espece && s.espece !== id) continue;
      const w = poidsSortie(s, now) * (1 - d / RAYON);
      sw += w;
      swy += w * (s.found ? 1 : 0);
    }
    return ajustement(sw, swy);
  };
  let maxBase = 0;
  const liste = ESPECES.map(e => {
    const base = scoreEspece(e, hab, en);
    if (base > maxBase) maxBase = base;
    return { e, p: clamp(base * ajustPour(e.id), 0, 1) };
  }).sort((a, b) => b.p - a.p);
  return { en, hab, liste, pToutes: clamp(maxBase * ajustPour('toutes'), 0, 1), nProches: proches.length };
}

/* ---------- Heatmap ---------- */

function rampe(t) {
  for (let i = 1; i < RAMPE.length; i++) {
    if (t <= RAMPE[i][0]) {
      const [t0, c0] = RAMPE[i - 1], [t1, c1] = RAMPE[i];
      const k = (t - t0) / (t1 - t0);
      return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
    }
  }
  return RAMPE[RAMPE.length - 1][1];
}

function dessinerHeatmap() {
  chaleur.clearLayers();
  majSaisons();
  const v = map.getBounds();
  const S = v.getSouth(), N = v.getNorth(), W = v.getWest(), E = v.getEast();
  const cosc = Math.cos(((S + N) / 2) * Math.PI / 180);
  const cols = COLONNES;
  const dLng = (E - W) / cols;
  const dLat = dLng * cosc;
  const rows = Math.ceil((N - S) / dLat);
  const nb = rows * cols;

  // Habitats par balayage ligne par ligne
  const masque = new Uint8Array(nb);
  if (habZone) {
    for (let r = 0; r < rows; r++) {
      const lat = S + (r + 0.5) * dLat;
      for (const poly of polys) {
        if (lat < poly.b[0] || lat > poly.b[2] || poly.b[3] < W || poly.b[1] > E) continue;
        const xs = [];
        for (const ring of poly.rings) {
          for (let k = 0; k < ring.length - 1; k++) {
            const a = ring[k], b = ring[k + 1];
            if ((a[0] > lat) !== (b[0] > lat)) xs.push(a[1] + (lat - a[0]) * (b[1] - a[1]) / (b[0] - a[0]));
          }
        }
        if (xs.length < 2) continue;
        xs.sort((x, y) => x - y);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          const c0 = Math.max(0, Math.ceil((xs[k] - W) / dLng - 0.5));
          const c1 = Math.min(cols - 1, Math.floor((xs[k + 1] - W) / dLng - 0.5));
          for (let c = c0; c <= c1; c++) {
            const i = r * cols + c;
            if (masque[i] === H.ouvert || masque[i] === H.foret) masque[i] = poly.h;
          }
        }
      }
    }
  }
  const hz = habZone
    ? { S: habZone.getSouth(), N: habZone.getNorth(), W: habZone.getWest(), E: habZone.getEast() }
    : null;

  // Ajustement par les sorties
  const sw = new Float32Array(nb), swy = new Float32Array(nb);
  const mLat = 111320, mLng = 111320 * cosc, now = Date.now();
  const nr = Math.ceil(RAYON / (dLat * mLat)), nc = Math.ceil(RAYON / (dLng * mLng));
  for (const s of sortiesPour(especeSel)) {
    const w0 = poidsSortie(s, now);
    if (w0 < 0.01) continue;
    const r0 = Math.floor((s.lat - S) / dLat), c0 = Math.floor((s.lng - W) / dLng);
    for (let r = Math.max(0, r0 - nr); r <= Math.min(rows - 1, r0 + nr); r++) {
      for (let c = Math.max(0, c0 - nc); c <= Math.min(cols - 1, c0 + nc); c++) {
        const dy = (S + (r + 0.5) * dLat - s.lat) * mLat;
        const dx = (W + (c + 0.5) * dLng - s.lng) * mLng;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > RAYON) continue;
        const w = w0 * (1 - d / RAYON);
        sw[r * cols + c] += w;
        swy[r * cols + c] += w * (s.found ? 1 : 0);
      }
    }
  }

  // Image : jaune = faible, rouge = élevé
  const esp = ESPECES.find(e => e.id === especeSel);
  const cv = document.createElement('canvas');
  cv.width = cols;
  cv.height = rows;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(cols, rows);
  for (let r = 0; r < rows; r++) {
    const lat = S + (r + 0.5) * dLat;
    for (let c = 0; c < cols; c++) {
      const lng = W + (c + 0.5) * dLng;
      const i = r * cols + c;
      const dansZone = hz && lat >= hz.S && lat <= hz.N && lng >= hz.W && lng <= hz.E;
      const hab = dansZone ? masque[i] : INCONNU;
      const en = envEn(lat, lng) || DEFAUT_ENV;
      let s = 0;
      if (esp) {
        s = scoreEspece(esp, hab, en);
      } else {
        for (const e of ESPECES) {
          const x = scoreEspece(e, hab, en);
          if (x > s) s = x;
        }
      }
      const p = clamp(s * ajustement(sw[i], swy[i]), 0, 1);
      const t = clamp(p / P_PLAFOND, 0, 1);
      const [R, G, B] = rampe(t);
      const o = ((rows - 1 - r) * cols + c) * 4;
      img.data[o] = R;
      img.data[o + 1] = G;
      img.data[o + 2] = B;
      img.data[o + 3] = Math.round(60 + 175 * t);
    }
  }
  ctx.putImageData(img, 0, 0);
  L.imageOverlay(cv.toDataURL(), [[S, W], [S + rows * dLat, E]], {
    pane: 'chaleur',
    opacity: OPACITE,
    interactive: false
  }).addTo(chaleur);
}

function texteInfo() {
  const l = [];
  if (env) {
    const g = env.meteo.resume;
    const pl = g.pMin === g.pMax ? g.pMin : `${g.pMin} à ${g.pMax}`;
    const tp = Math.abs(g.tMax - g.tMin) < 0.1 ? f1(g.tMin) : `${f1(g.tMin)} à ${f1(g.tMax)}`;
    l.push(`Pluie 2 sem. : ${pl} mm, temp. moy. : ${tp} °C`);
  } else if (chargementEnv) {
    l.push('Météo : chargement…');
  } else {
    l.push(`Météo indisponible${envErreur ? ' (' + envErreur + ')' : ''}`);
  }
  if (chargementHab) l.push('Habitats : chargement…');
  else if (habZone) l.push(`Habitats : ${polys.length} zones (${habSource})`);
  else l.push(`Habitats non chargés${habErreur ? ' (' + habErreur + ')' : ''}`);
  l.push(sorties.length ? `${sorties.length} sortie(s) enregistrée(s)` : 'Aucune sortie enregistrée');
  return l.join('<br>');
}

async function actualiser(force) {
  if (force) {
    env = null; chargementEnv = null; envErreur = '';
    habZone = null; chargementHab = null; habErreur = ''; habSource = ''; polys = [];
    cacheMeteo = {};
  }
  if (map.getZoom() < ZOOM_MIN) {
    chaleur.clearLayers();
    info('Zoome sur une zone (niveau commune) pour afficher la heatmap.');
    return;
  }
  const vue = map.getBounds();
  const pe = assurerEnv(vue);
  const ph = assurerHab(vue);
  info(texteInfo());
  ph.then(() => {
    if (map.getZoom() >= ZOOM_MIN && (env || !chargementEnv)) { dessinerHeatmap(); info(texteInfo()); }
  });
  await pe;
  if (map.getZoom() < ZOOM_MIN) return;
  dessinerHeatmap();
  info(texteInfo());
}

/* ---------- Interface ---------- */

function changerEspece() {
  especeSel = sel.value;
  localStorage.setItem(KEY_ESP, especeSel);
  majLegende();
  if (map.getZoom() >= ZOOM_MIN) {
    dessinerHeatmap();
    info(texteInfo());
  }
}

function render() {
  couche.clearLayers();
  sorties.forEach(s => {
    L.circleMarker([s.lat, s.lng], {
      radius: 7,
      color: '#fff',
      weight: 2,
      fillColor: s.found ? '#1b7f3b' : '#555',
      fillOpacity: 0.95
    }).bindPopup(popupHtml(s)).addTo(couche);
  });
  if (map.getZoom() >= ZOOM_MIN) {
    dessinerHeatmap();
    info(texteInfo());
  }
}

function popupHtml(s) {
  const d = new Date(s.date).toLocaleDateString('fr-FR');
  let h = `<b>${d}</b><br>${s.found ? 'Trouvé' : 'Rien trouvé'}`;
  const e = s.espece ? ESPECES.find(x => x.id === s.espece) : null;
  if (e) h += `<br>${e.nom}`;
  if (s.qty) h += `<br>${esc(s.qty)}`;
  if (s.note) h += `<br><i>${esc(s.note)}</i>`;
  if (s.pluie != null) h += `<br>Pluie : ${Math.round(s.pluie)} mm`;
  if (s.indice != null) h += `<br>Indice météo : ${Math.round(s.indice * 100)} %`;
  h += `<br><button class="sec" onclick="supprimer(${s.id})">Supprimer</button>`;
  return h;
}

function supprimer(id) {
  if (!confirm('Supprimer cette sortie ?')) return;
  sorties = sorties.filter(s => s.id !== id);
  save(); render(); map.closePopup();
}

function openPanel(html) { panel.innerHTML = html; panel.style.display = 'block'; }

function closePanel() {
  panel.style.display = 'none';
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
}

function menu() {
  openPanel(`
    <h3>Menu</h3>
    <button onclick="closePanel(); actualiser(true)">Actualiser les données</button>
    <button onclick="exporter()">Exporter</button>
    <label class="btn">Importer<input type="file" accept="application/json" onchange="importer(event)" style="display:none"></label>
    <p class="muted">Version ${VERSION}. Météo et altitude : Open-Meteo. Habitats : IGN BD Forêt, ou OpenStreetMap en secours.</p>
    <button class="sec" onclick="closePanel()">Fermer</button>
  `);
}

function showSpot(lat, lng) {
  const r = especesEn(lat, lng);
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng]).addTo(map);
  const esp = ESPECES.find(e => e.id === especeSel);
  const titre = esp ? esp.nom : 'Toutes espèces';
  const selP = esp ? r.liste.find(x => x.e.id === esp.id).p : r.pToutes;
  const hab = r.hab === INCONNU ? 'non chargé' : NOMS_HAB[HABITATS[r.hab]];
  let envTxt = `Habitat : ${hab}`;
  if (r.en.alt != null) envTxt += `<br>Altitude : ${Math.round(r.en.alt)} m`;
  envTxt += `<br>Pluie (2 sem.) : ${Math.round(r.en.pluie)} mm<br>Température moyenne (10 j) : ${f1(r.en.t)} °C`;
  envTxt += `<br>Tes sorties à moins de ${RAYON} m : ${r.nProches}`;
  const visibles = r.liste.filter(x => x.p >= 0.05).slice(0, 6);
  const espHtml = visibles.length
    ? visibles.map(x => `<div class="esp"><b>${x.e.nom}</b> <i>${x.e.latin}</i> : ${Math.round(x.p * 100)} %` +
        (x.e.conf ? `<br><span class="conf">Confusions possibles : ${x.e.conf}</span>` : '') + '</div>').join('')
    : '<p class="muted">Aucune espèce favorisée par les conditions actuelles à cet endroit.</p>';
  openPanel(`
    <h3>${titre} : ${Math.round(selP * 100)} %</h3>
    <p class="muted">${envTxt}</p>
    <b>Espèces possibles ici</b>
    ${espHtml}
    <p class="alerte">L'amanite phalloïde, mortelle, pousse dans les mêmes forêts de l'été à la fin de l'automne. Cette carte n'identifie aucun champignon : fais contrôler toute récolte par un pharmacien ou une société mycologique.</p>
    <button onclick="openForm(${lat}, ${lng})">Noter une sortie ici</button>
    <button class="sec" onclick="closePanel()">Fermer</button>
  `);
}

function openForm(lat, lng) {
  const maintenant = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const opts = ESPECES.map(e => `<option value="${e.id}"${e.id === especeSel ? ' selected' : ''}>${e.nom}</option>`).join('');
  openPanel(`
    <h3>Nouvelle sortie</h3>
    <label>Date et heure<input id="f-date" type="datetime-local" value="${maintenant}"></label>
    <label>Résultat
      <select id="f-found"><option value="1">J'ai trouvé</option><option value="0">Rien trouvé</option></select>
    </label>
    <label>Espèce trouvée ou cherchée (facultatif)
      <select id="f-esp"><option value="">Non précisée</option>${opts}</select>
    </label>
    <label>Quantité (facultatif)<input id="f-qty" placeholder="ex. 1 kg, 5 cèpes"></label>
    <label>Note (facultatif)<textarea id="f-note" rows="2"></textarea></label>
    <button onclick="saveSortie(${lat}, ${lng})">Enregistrer</button>
    <button class="sec" onclick="closePanel()">Annuler</button>
  `);
}

async function saveSortie(lat, lng) {
  const dateVal = document.getElementById('f-date').value;
  const found = document.getElementById('f-found').value === '1';
  const espece = document.getElementById('f-esp').value;
  const qty = document.getElementById('f-qty').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const date = dateVal ? new Date(dateVal) : new Date();
  const mt = await meteoPoint(lat, lng, date);
  sorties.push({
    id: Date.now(),
    lat, lng,
    date: date.toISOString(),
    found, espece, qty, note,
    pluie: mt ? Math.round(mt.pluie) : null,
    indice: mt ? Math.round(mt.indice * 100) / 100 : null
  });
  save(); render(); closePanel();
}

function locate() {
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    map.setView([lat, lng], 15);
    showSpot(lat, lng);
  }, () => alert('Position indisponible. Vérifie l\'autorisation de localisation.'),
  { enableHighAccuracy: true, timeout: 10000 });
}

function exporter() {
  const blob = new Blob([JSON.stringify(sorties, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cueillette-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function importer(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      sorties = sorties.concat(data.filter(d => !sorties.some(s => s.id === d.id)));
      save(); render(); closePanel();
      alert('Import terminé');
    } catch (err) {
      alert('Fichier invalide');
    }
  };
  r.readAsText(f);
}

map.on('click', e => showSpot(e.latlng.lat, e.latlng.lng));
map.on('moveend', () => {
  clearTimeout(minuterie);
  minuterie = setTimeout(() => actualiser(false), 600);
});

majLegende();
render();
if (sorties.length) {
  const s = sorties[sorties.length - 1];
  map.setView([s.lat, s.lng], 14);
} else {
  actualiser(false);
}
</script>
</body>
</html>
